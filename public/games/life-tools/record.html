<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Record voices · Habesha Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#F4F1EC;--text:#1B1B1B;--sub:#5E5A54;--g:#1E7B4F;--r:#C8341E}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1F1F1F;--text:#F3EFE8;--sub:#A8A196;--g:#4FC48A;--r:#F27A63}}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Noto Sans Ethiopic',sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0}.muted{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button{font:inherit;border:0;border-radius:100px;padding:10px 16px;background:var(--card);color:var(--text);cursor:pointer;min-height:44px}
button.on,.go{background:var(--g);color:#fff}
.rec{background:var(--r);color:#fff}
ul{list-style:none;padding:0}
li{background:var(--card);border-radius:18px;padding:14px;margin:10px 0}
.gz{font-size:1.5rem;font-weight:700}
.done{color:var(--g);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙 Record the Life Tools phrases</h1>
  <p class="muted">For a native speaker. Read the phrase clearly, at a calm speed. Your recording replaces the computer voice in the app straight away.
  Only the Habesha Hub admin can save.</p>
  <div class="row" id="auth"></div>
  <div class="row" id="langs"></div>
  <p class="muted" id="count"></p>
  <ul id="list"></ul>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../shared/firebase-config.js"></script>
<script>
// Records one phrase at a time in the browser and uploads it to Storage voices/<lang>/<id>.
// The game (index.html) plays these first and falls back to voice/<lang>/<id>.mp3 (computer voice).
firebase.initializeApp(Object.assign({ storageBucket: 'habesha-hub-7bd1d.firebasestorage.app' }, window.HABESHA_FIREBASE_CONFIG));
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let lang = 'ti', phrases = [], have = new Set(), rec = null, chunks = [], recId = null, takes = {};

function drawAuth() {
  const u = firebase.auth().currentUser;
  $('auth').innerHTML = u ? `<span class="muted">${esc(u.email)}</span><button id="out">Log out</button>`
                          : `<button class="go" id="in">Log in with Google</button>`;
  if (u) $('out').onclick = () => firebase.auth().signOut(); else $('in').onclick = () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
}
firebase.auth().onAuthStateChanged(drawAuth);

function drawLangs() {
  $('langs').innerHTML = [['ti', 'ትግርኛ'], ['am', 'አማርኛ']].map(([k, n]) => `<button data-k="${k}" class="${k === lang ? 'on' : ''}">${n}</button>`).join('');
}
$('langs').onclick = e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.k; drawLangs(); check(); };

// which phrases already have a recording
async function check() {
  have = new Set();
  const ref = firebase.storage().ref(`voices/${lang}`);
  try { (await ref.listAll()).items.forEach(i => have.add(i.name)); } catch (e) {}
  draw();
}

function draw() {
  $('count').textContent = `${have.size} of ${phrases.length} recorded`;
  $('list').innerHTML = phrases.map(p => `<li>
    <div class="gz">${esc(p[lang])}</div><div class="muted">${esc(p.en)} · ${esc(p.no)}</div>
    <div class="row">
      ${have.has(p.id) ? '<span class="done">✓ recorded</span>' : ''}
      <button data-a="machine" data-id="${p.id}">▶ computer voice</button>
      ${have.has(p.id) ? `<button data-a="mine" data-id="${p.id}">▶ recording</button>` : ''}
      <button data-a="rec" data-id="${p.id}" class="${recId === p.id ? 'rec' : ''}">${recId === p.id ? '■ Stop' : '🎙 Record'}</button>
      ${takes[p.id] ? `<button data-a="take" data-id="${p.id}">▶ new take</button><button data-a="save" data-id="${p.id}" class="go">⬆ Save</button>` : ''}
    </div></li>`).join('');
}

const play = url => new Audio(url).play().catch(() => alert('Could not play'));
$('list').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  if (a === 'machine') play(`voice/${lang}/${id}.mp3`);
  if (a === 'mine') play(await firebase.storage().ref(`voices/${lang}/${id}`).getDownloadURL());
  if (a === 'take') play(URL.createObjectURL(takes[id]));
  if (a === 'rec') {
    if (recId === id) { rec.stop(); return; }
    if (rec && rec.state === 'recording') rec.stop();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const type = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
    rec = new MediaRecorder(stream, { mimeType: type }); chunks = []; recId = id;
    rec.ondataavailable = ev => chunks.push(ev.data);
    rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); takes[id] = new Blob(chunks, { type }); recId = null; draw(); };
    rec.start(); draw();
  }
  if (a === 'save') {
    if (!firebase.auth().currentUser) { alert('Log in first'); return; }
    b.textContent = '…';
    try {
      await firebase.storage().ref(`voices/${lang}/${id}`).put(takes[id], { contentType: takes[id].type, cacheControl: 'public,max-age=3600' });
      delete takes[id]; have.add(id); draw();
    } catch (err) { alert('Could not save: ' + err.message); b.textContent = '⬆ Save'; }
  }
};

fetch('voice/phrases.json').then(r => r.json()).then(list => { phrases = list; drawLangs(); check(); });
</script>
</body>
</html>
