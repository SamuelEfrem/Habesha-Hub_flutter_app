<!doctype html>
<html lang="ti">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habesha Life Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@500;700;800&family=Noto+Sans+Arabic:wght@500;700&family=Noto+Sans+Hebrew:wght@500;700&display=swap">
<style>
/* Layout: calm utility app — header, three tabs, each tool in one card; Tigrinya throughout */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --ink:#15202b; --muted:#5b6b7a; --line:#dbe3eb;
  --accent:#0a6ebd; --accent-soft:#e3f0fb; --good:#1f9d63; --bad:#d64545; --gold:#c98a00;
  --ui:"Noto Sans Ethiopic","Figtree",system-ui,sans-serif; --latin:"Figtree","Noto Sans Arabic","Noto Sans Hebrew","Noto Sans Ethiopic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212b; --ink:#e8eef4; --muted:#9db0c2; --line:#2a3644;
  --accent:#58aef0; --accent-soft:#16304a; --good:#46c98b; --bad:#f07070; --gold:#f0b13a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212b; --ink:#e8eef4; --muted:#9db0c2; --line:#2a3644;
  --accent:#58aef0; --accent-soft:#16304a; --good:#46c98b; --bad:#f07070; --gold:#f0b13a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1{font-size:1.6rem;font-weight:800;margin:0;line-height:1.2}
h1 small{display:block;font-weight:500;font-size:.95rem;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
nav button{font:700 .92rem var(--ui);border:0;background:transparent;color:var(--muted);border-radius:10px;padding:9px 4px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
h2{font-size:1.15rem;margin:0}
.muted{color:var(--muted);margin:0;font-size:.92rem}
.btn{font:800 1rem var(--ui);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent);transition:width .3s}
.qhead{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-weight:700;font-size:1.18rem;margin:0;line-height:1.7}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;font:600 1rem var(--ui);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.opts button.no{border-color:var(--bad)}
.opts button.dim{opacity:.45}
.explain{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result b{font-size:2.6rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:700 .9rem var(--latin);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips.topics button{font-family:var(--ui)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.switch button{font:700 .88rem var(--ui);border:0;border-radius:999px;padding:6px 12px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.phrases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.phrases li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.phrases .tix{font-weight:700}
.phrases .tg{font-family:var(--latin);font-weight:700;font-size:1.08rem;color:var(--accent)}
.phrases .tg.hide{color:transparent;background:var(--line);border-radius:6px;cursor:pointer;user-select:none}
.phrases .rom.hide{visibility:hidden}
.phrases .rom{font-family:var(--latin);color:var(--muted);font-size:.85rem}
.say{border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;font:800 .85rem var(--ui);cursor:pointer;white-space:nowrap}

.today{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:8px 0}
.today .d{font:800 3.6rem var(--ui);line-height:1;color:var(--accent)}
.today .m{font:800 1.6rem var(--ui)}
.today .y{color:var(--muted)}
.feast{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:12px}
.feast .ic{font-size:1.8rem}
.feast b{display:block}
.fast{font-weight:800}
.fast.yes{color:var(--gold)} .fast.no{color:var(--good)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.list span{color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:0}
.btn small{display:block;font-weight:700;font-size:.78rem;opacity:.8}
.lock{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px dashed var(--line);border-radius:14px;padding:12px}
.lock b{display:block}
.row2{display:flex;gap:8px;justify-content:space-between}
.opts button.picked{border-color:var(--accent);background:var(--accent-soft)}
.wrongs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.lockli{display:flex!important;flex-direction:column;align-items:flex-start}
.phrases .tg.gz{font-family:var(--ui)}
.lbl{font-weight:700;font-size:.85rem;color:var(--muted);margin:0}
.signrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.qimg{display:flex;justify-content:center}
.opts.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts .sopt{display:flex;justify-content:center;padding:10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gitem{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.82rem;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.wrongs li .sign{vertical-align:middle;margin-right:6px}
#unlockBox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:99}
#unlockBox .ub-in{background:#151c24;border:1px solid #2b3a4a;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;position:relative}
#unlockBox h3{margin:0 0 8px}#unlockBox .ub-x{position:absolute;top:10px;right:12px;background:none;border:0;color:#aaa;font-size:20px}
#unlockBox input{width:100%;box-sizing:border-box;margin:12px 0 8px;padding:14px;border-radius:12px;border:1px solid #2b3a4a;background:#0e141a;color:#fff;font-size:18px;letter-spacing:2px;text-transform:uppercase}
#unlockBox .btn{display:block;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;margin-top:8px}
#unlockBox .wa{background:#25D366;color:#06210f}
#unlockBox .pay{background:#D4AF37;color:#1A1200}
#unlockBox .ub-sec{border:1px solid #2b3a4a;border-radius:14px;padding:12px;margin:10px 0}
#unlockBox .ub-sec p{margin:6px 0}
</style>

<style>
[hidden]{display:none!important}
html,body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app .wrap{padding-top:52px}
</style>
<script>if(new URLSearchParams(location.search).get("app")==="1")document.documentElement.classList.add("app")</script>
</head>
<body>
<div class="wrap" lang="ti">
  <h1>ሓገዝ ሂወት ሓበሻ<small>መንጃ ፍቓድ · ቋንቋታት · ዓውደ ኣዋርሕ</small></h1>
  <nav role="tablist" id="tabs">
    <button role="tab" data-t="teori" aria-selected="true">መንጃ ፍቓድ</button>
    <button role="tab" data-t="lang" aria-selected="false">ቋንቋ</button>
    <button role="tab" data-t="cal" aria-selected="false">ዓውደ ኣዋርሕ</button>
  </nav>

  <section id="teori" class="card">
    <h2>ፈተና ቲዮሪ መንጃ ፍቓድ ክፍሊ B</h2>
    <div class="qhead" id="qhead" hidden><span id="qn"></span><span id="qs"></span></div>
    <div class="prog" id="qprog" hidden><b id="qp"></b></div>
    <div id="qbody" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>

  <section id="lang" class="card" hidden>
    <h2 id="langTitle">ቋንቋ ምምሃር</h2>
    <p class="lbl" id="speakLbl"></p>
    <div class="chips" id="bases"></div>
    <p class="lbl" id="learnLbl"></p>
    <div class="chips" id="langs"></div>
    <div class="chips topics" id="topics"></div>
    <div class="switch" id="modeRow"><span class="muted" id="modeTxt"></span><button id="mode"></button></div>
    <ul class="phrases" id="phrases"></ul>
    <p class="note" id="voiceNote"></p>
  </section>
  <!-- CALENDAR -->
  <section id="cal" class="card" hidden>
    <h2>ዓውደ ኣዋርሕ ግእዝ</h2>
    <div class="today">
      <span class="muted" id="gToday"></span>
      <span class="d" id="eDay"></span>
      <span class="m" id="eMonth"></span>
      <span class="y" id="eYear"></span>
    </div>
    <div class="feast" id="feast"></div>
    <p style="margin:0">ሎሚ፦ <span class="fast" id="fast"></span></p>
    <h2 style="font-size:1rem">ዝቐርቡ በዓላት</h2>
    <ul class="list" id="hol"></ul>
  </section>

  <p class="note">ቅድሚ ምዝርጋሑ፡ ትግርኛ ብመምህር ቋንቋ፡ ሕቶታት መንጃ ፍቓድ ድማ ምስ ሕጊ Statens vegvesen ክረጋገጹ ኣለዎም።</p>
</div>

<script>
/* Class B theory questions in Tigrinya. Only the FREE rule questions are in this page.
   The 450 paid ones live in Firestore (theory_pro) and the app injects them with
   window.habeshaAddQuestions() after the user unlocked with a code. */
const Q=[
["ኣብ ውሽጢ ከተማ ምልክት ፍጥነት እንተዘየለ፡ ዝለዓለ ዝተፈቕደ ፍጥነት ክንደይ እዩ?",["30 km/h","50 km/h","60 km/h","80 km/h"],1,"ምልክት እንተዘየለ፡ ኣብ ውሽጢ ከተማ 50 km/h እዩ።"],
["ካብ ከተማ ወጻኢ ምልክት እንተዘየለ፡ ዝለዓለ ፍጥነት ክንደይ እዩ?",["60 km/h","70 km/h","80 km/h","90 km/h"],2,"ካብ ከተማ ወጻኢ ምልክት እንተዘየለ 80 km/h እዩ።"],
["ኣብ ኖርወይ እቲ ዝለዓለ ፍጥነት ዝፍቀደሉ ጽርግያ ክንደይ እዩ?",["90 km/h","100 km/h","110 km/h","130 km/h"],2,"ኣብ ገለ ኣውቶስትራዳታት ክሳብ 110 km/h ይፍቀድ፡ ምልክት እንተሎ ጥራይ።"],
["ኣብ ኖርወይ ዝተፈቕደ መጠን ኣልኮል ኣብ ደም ክንደይ እዩ?",["0.0 ፕሮሚል","0.2 ፕሮሚል","0.5 ፕሮሚል","0.8 ፕሮሚል"],1,"ገደቡ 0.2 ፕሮሚል እዩ። ዝበለጸ ምኽሪ፡ ሰትካ ኣይትዘውር።"],
["ምልክት ዘይብሉ መስቀላ ጽርግያ ኣብ እትበጽሕ፡ መን እዩ ቅድሚ ዝሓልፍ?",["ካብ ጸጋም ዝመጽእ","ካብ የማን ዝመጽእ","እቲ ዝቐልጠፈ","እቲ ዝዓበየ መኪና"],1,"ሕጊ የማን፡ ካብ የማንካ ንዝመጽእ መኪና ቅድሚ ሃቦ።"],
["ቆልዓ ቁመቱ ትሕቲ ክንደይ ክኸውን ከሎ እዩ ፍሉይ መቐመጢ ቆልዓ ዘድልዮ?",["120 cm","135 cm","150 cm","160 cm"],1,"ቆልዑ ትሕቲ 135 cm ብፍሉይ መቐመጢ ቆልዓ ክቕመጡ ኣለዎም።"],
["ክትዝውር ከለኻ ተሌፎን ብኢድካ ሒዝካ ምጥቃም ይፍቀድ ድዩ?",["እወ፡ ኣብ ቀይሕ መብራህቲ","እወ፡ ንሓጺር ጻውዒት","ኣይፍቀድን","ኣብ ከተማ ጥራይ ይፍቀድ"],2,"ኣይፍቀድን። ብዘይ ኢድ ዝሰርሕ መሳርሒ ጥራይ ክትዛረብ ትኽእል።"],
["ጎማታት ግዜ ቁሪ እንተወሓደ ክንደይ ዕምቆት ስእሊ ክህልዎም ኣለዎ?",["1.6 mm","2 mm","3 mm","5 mm"],2,"ጎማታት ግዜ ቁሪ እንተወሓደ 3 mm ዕምቆት ክህልዎም ኣለዎ።"],
["ጎማታት ግዜ ሓጋይ እንተወሓደ ክንደይ ዕምቆት ስእሊ ክህልዎም ኣለዎ?",["1.0 mm","1.6 mm","3 mm","4 mm"],1,"ጎማታት ግዜ ሓጋይ እንተወሓደ 1.6 mm ክህልዎም ኣለዎ።"],
["ኣብ ኖርወይ መብራህቲ መኪና መዓስ ክውላዕ ኣለዎ?",["ለይቲ ጥራይ","ኣብ ዝናብ ጥራይ","ኩሉ ግዜ፡ ቀትሪ እውን","ኣብ ቱነል ጥራይ"],2,"ኣብ ኖርወይ ቀትሪን ለይትን ኩሉ ግዜ ብመብራህቲ ትዝውር።"],
["ሰብ ኣብ መሳገሪ እግረኛ (ዜብራ) ክሰግር ይደሊ ኣሎ። እንታይ ትገብር?",["ጡሩምባ ትህብ","ደው ኢልካ ተሕልፎ","ፍጥነት ትውስኽ","ብጐድኑ ትሓልፍ"],1,"ነቲ ኣብ መሳገሪ ዘሎ ወይ ክኣቱ ዝደሊ እግረኛ ቅድሚ ክትህቦ ግዴታ ኣለካ።"],

function seeded(seed){let s=seed;return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648}}
function buildSignQuestions(){const out=[],rnd=seeded(7);
  const pick=(arr,n,not)=>{const pool=arr.filter(x=>x!==not);const r=[];while(r.length<n&&pool.length){r.push(pool.splice(Math.floor(rnd()*pool.length),1)[0])}return r};
  const groupOf=g=>SIGNS.filter(s=>s[4]===g||(["prohib","speed"].includes(g)&&["prohib","speed"].includes(s[4]))).map(s=>s[0]);
  const all=SIGNS.map(s=>s[0]);
  SIGNS.forEach(([id,,,mean,grp])=>{
    let same=groupOf(grp);if(same.length<4)same=same.concat(pick(all,4,id).filter(x=>!same.includes(x)));
    const others=pick(same,3,id);const opts=[id,...others];const order=opts.map((x,i)=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    const lead=grp==="light"?"እዚ መብራህቲ እንታይ ማለት እዩ?":grp==="mark"?"እዚ ምልክት ኣብ ጽርግያ እንታይ ማለት እዩ?":"እዚ ምልክት እንታይ ማለት እዩ?";
    out.push({q:lead,img:id,o:order.map(x=>SIGN[x].mean),c:order.indexOf(id),ex:mean,cat:"sign"});
    if(grp!=="light"&&grp!=="mark"){
      const order2=pick(same,3,id).concat([id]).map(x=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
      out.push({q:`«${mean}» ዝብል ምልክት ኣየናይ እዩ?`,o:order2.map(x=>({s:x})),c:order2.indexOf(id),ex:mean,cat:"sign"})}});
  const KIND={warn:"ምልክት ሓደጋ (መጠንቀቕታ)",prohib:"ምልክት ክልከላ",speed:"ምልክት ክልከላ",mand:"ምልክት ግዴታ",info:"ምልክት ሓበሬታ",prio:"ምልክት ቅድሚ"};
  const KOPTS=["ምልክት ሓደጋ (መጠንቀቕታ)","ምልክት ክልከላ","ምልክት ግዴታ","ምልክት ሓበሬታ","ምልክት ቅድሚ"];
  SIGNS.forEach(([id,,,mean,grp],i)=>{if(!KIND[grp]||i%2)return;const right=KIND[grp];const opts=[right,...pick(KOPTS.filter(k=>k!==right),3)];
    const order=opts.map(x=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    out.push({q:"እዚ ምልክት ካብ ኣየናይ ዓይነት እዩ?",img:id,o:order,c:order.indexOf(right),ex:`${right}፡ ${mean}።`,cat:"sign"})});
  const ACT={curveR:"ፍጥነት ኣንኪስካ ብጥንቃቐ ጠውይ",curveL:"ፍጥነት ኣንኪስካ ብጥንቃቐ ጠውይ",dbl:"ፍጥነት ኣንኪስካ ብጥንቃቐ ጠውይ",
   slope:"ብትሑት ማርሻ ኪድ፡ ፍረኖ ብዙሕ ከይተሞቕ",narrows:"ቀስ በል፡ ምስ ዝመጽእ ትራፊክ ተሰማማዕ",bumps:"ፍጥነት ኣንክይ",hump:"ፍጥነት ኣንክይ",
   slippery:"ቀስ በል፡ ብሃንደበት ፍረኖን መሪሕን ኣይትግበር",works:"ቀስ በል፡ ንሰራሕተኛታትን ምልክታትን ተኸተል",peds:"ደው ክትብል ተዳሎ፡ ንእግረኛታት ተጠንቀቕ",
   kids:"ብዙሕ ቀስ በል፡ ቆልዑ ብሃንደበት ክሰግሩ ይኽእሉ",bikes:"ንብሽክለታታት ተጠንቀቕ፡ ርሕቀት ሕደግ",deer:"ቀስ በል፡ እንስሳታት ክሰግሩ ይኽእሉ",

   railGate:"ቀስ በል፡ ኣብ ልዕሊ ሓዲድ ደው ኣይትበል",railNoGate:"ቀስ በል፡ ባቡር ከይመጸ ጸጋምን የማንን ርአ",roundAhead:"ቀስ በል፡ ኣብ ሮቶንዳ ዘለዉ ቅድሚ ሃቦም",
   twoWay:"ብየማን ጎድኒ ሓዝ፡ ካብ ቅድሚ ትራፊክ ኣሎ",queue:"ቀስ በል፡ ደው ክትብል ተዳሎ",give:"ቅድሚ ሃብ፡ ኣድላዪ እንተኾይኑ ደው በል",
   stop:"ኣብ መስመር ደው ምባል ምሉእ ብምሉእ ደው በል",prio:"ቅድሚ ኣሎካ፡ ግን ብጥንቃቐ ኪድ",prioEnd:"ሕጊ የማን ደጊሙ ይሰርሕ፡ ተጠንቀቕ"};
  const ACTS=[...new Set(Object.values(ACT))];
  Object.keys(ACT).forEach(id=>{const right=ACT[id];const opts=[right,...pick(ACTS.filter(a=>a!==right),3)];
    const order=opts.map(x=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    out.push({q:"ነዚ ምልክት ምስ ረኣኻ እንታይ ትገብር?",img:id,o:order,c:order.indexOf(right),ex:`${SIGN[id].mean}፡ ${right}።`,cat:"sign"})});
  return out}

function startRun(mode){const p=shuffle(pool(mode==="exam"?null:mode));run={mode,order:mode==="exam"?p.slice(0,examN()):p,i:0,score:0,wrong:0,answered:false,answers:[]};showQ()}

  const q=ALLQ[run.order[run.i]];run.answered=false;const signOpts=typeof q.o[0]==="object";
  $("qn").textContent=`ሕቶ ${run.i+1} ካብ ${n}`;$("qs").textContent=run.mode==="exam"?"ፈተና":`${run.score} ቅኑዕ`;
  $("qp").style.width=(run.i/n*100)+"%";
  $("qbody").innerHTML=`${q.img?`<div class="qimg">${signSVG(q.img,130)}</div>`:""}<p class="q">${esc(q.q)}</p><div class="opts ${signOpts?"sgrid":""}" id="opts">${q.o.map(optHTML).join("")}</div>

  $("opts").onclick=e=>{const b=e.target.closest("button");if(!b||run.answered)return;run.answered=true;const i=+b.dataset.i,ok=i===q.c;

    else{b.classList.add("picked");setTimeout(()=>{run.i++;showQ()},250)}};
  $("next").onclick=()=>{run.i++;showQ()};
  $("quit").onclick=()=>{run=null;drawTheoryHome()}}
function finish(){const n=run.order.length;$("qp").style.width="100%";$("qs").textContent="";$("qn").textContent="";
  let html;
  if(run.mode==="exam"){const pass=run.wrong<=examMaxWrong();
    const wrongList=run.answers.filter(a=>a.i!==ALLQ[a.q].c).map(a=>{const q=ALLQ[a.q],right=q.o[q.c];
      return `<li>${q.img?signSVG(q.img,48):""}<b>${esc(q.q)}</b><br><span class="muted">✓ ${typeof right==="object"?signSVG(right.s,40):esc(right)} ${esc(q.ex)}</span></li>`}).join("");

  else{html=`<div class="result"><b>${run.score}/${n}</b><p class="q">${run.score>=n*0.85?"ጽቡቕ! ድሉው ኢኻ 🎉":"ዝያዳ ተለማመድ፡ ክትሓልፍ ኢኻ!"}</p></div>`}
  $("qbody").innerHTML=html+`<button class="btn" id="home2">ተመለስ</button>`;$("home2").onclick=()=>{run=null;drawTheoryHome()}}

const MONTHLY={1:["ልደታ ለማርያም","🌸"],5:["ኣቡነ ገብረ መንፈስ ቅዱስ","🙏"],7:["ስላሴ","✝️"],12:["ቅዱስ ሚካኤል","🛡️"],16:["ኪዳነ ምሕረት","🕊️"],19:["ቅዱስ ገብርኤል","📯"],21:["ማርያም","🌹"],23:["ቅዱስ ጊዮርጊስ","🐎"],24:["ተክለ ሃይማኖት","📿"],27:["መድሃኔ ኣለም","✝️"],29:["በዓለ ወልድ","⭐"]};
const toJdn=(y,m,d)=>EPOCH+365*(y-1)+Math.floor(y/4)+30*(m-1)+d-1;
function fromJdn(j){const y=Math.floor((4*(j-EPOCH)+1463)/1461);const doy=j-toJdn(y,1,1);return{y,m:Math.floor(doy/30)+1,d:doy%30+1}}
const gToJdn=dt=>Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/864e5)+2440588;
const jdnToG=j=>new Date((j-2440588)*864e5);
const pad=n=>String(n).padStart(2,"0");
const now=new Date();const jd=gToJdn(now);const e=fromJdn(jd);
$("gToday").textContent=`${WD[now.getDay()]} · ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
$("eDay").textContent=e.d;$("eMonth").textContent=MONTHS[e.m-1];$("eYear").textContent=e.y+" ዓ.ም.";
const f=MONTHLY[e.d];
let nextF="ኣብ ዝመጽእ ወርሒ";for(let k=e.d+1;k<=30;k++)if(MONTHLY[k]){nextF=`${MONTHLY[k][0]}፡ ${MONTHS[e.m-1]} ${k}`;break}
$("feast").innerHTML=f?`<span class="ic">${f[1]}</span><div><b>${f[0]}</b><span class="muted">ሎሚ ወርሓዊ ዝኽሪ እዩ</span></div>`
 :`<span class="ic">📅</span><div><b>ሎሚ ዓቢ ወርሓዊ በዓል የለን</b><span class="muted">ዝቕጽል፦ ${esc(nextF)}</span></div>`;
const wd=now.getDay();
$("fast").innerHTML=(wd===3||wd===5)?`<span class="fast yes">መዓልቲ ጾም እዩ (ረቡዕን ዓርብን)</span>`:`<span class="fast no">ናይ ሰሙን መዓልቲ ጾም ኣይኮነን</span>`;
const HOL=[["መስቀል",1,17],["ሕዳር ጽዮን",3,21],["ልደት",4,29],["ጥምቀት",5,11]];
const up=[];[e.y,e.y+1].forEach(y=>HOL.forEach(([ti,m,d])=>{const j=toJdn(y,m,d);if(j>=jd)up.push({ti,j})}));
up.sort((a,b)=>a.j-b.j);
$("hol").innerHTML=up.slice(0,4).map(h=>{const g=jdnToG(h.j);const days=h.j-jd;
  return `<li><b>${h.ti}</b><span>${pad(g.getUTCDate())}/${pad(g.getUTCMonth()+1)}/${g.getUTCFullYear()} · ${days===0?"ሎሚ":days+" መዓልቲ ተሪፉ"}</span></li>`}).join("");
</script>
