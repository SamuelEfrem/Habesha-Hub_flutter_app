<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habesha Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Nunito:wght@400;700;800&family=Noto+Sans+Ethiopic:wght@600;800&display=swap">
<style>
/* Layout: highland-night app shell with a tilet stripe; home grid of game cards; each game opens full width with a back bar and a play-mode chooser */
:root{
  --bg:#0d1b26; --surface:#142836; --stage:#0f2230; --ink:#f2f7fa; --muted:#a2b8c6; --line:#24404f;
  --gold:#f7c948; --red:#e0483a; --green:#3ccf8e; --sky:#4fb3ff; --cream:#f6ead2;
  --display:"Sora","Noto Sans Ethiopic",system-ui,sans-serif; --body:"Nunito","Noto Sans Ethiopic",system-ui,sans-serif; --geez:"Noto Sans Ethiopic","Nyala",serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.tilet{height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 12px,var(--gold) 12px 18px,var(--green) 18px 30px,var(--gold) 30px 36px)}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0;line-height:1.1}
h1 small{display:block;font-family:var(--geez);font-weight:600;font-size:1rem;color:var(--gold)}
.langs{display:flex;gap:6px}
.langs button{font:800 .85rem var(--display);border:2px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sect{font:800 .8rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:14px;cursor:pointer;font:inherit;text-decoration:none;min-width:0}
.card .ic{font-size:2rem;line-height:1.1}
.card b{font-family:var(--display);font-size:1.02rem}
.card .gz{font-family:var(--geez);color:var(--gold);font-size:.9rem}
.card .tg{font-size:.75rem;color:var(--muted);font-weight:700}
.card.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(120deg,#1b3a52,#142836)}
.card.big .ic{font-size:2.6rem}
.bar{display:flex;align-items:center;gap:10px}
.back{font:800 1rem var(--display);border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer}
.bar h2{font-family:var(--display);font-size:1.25rem;margin:0;flex:1;min-width:0}
.bar h2 .ti{font-family:var(--geez);color:var(--gold);font-weight:600;margin-left:6px}
.game{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.game h2{font-family:var(--display);font-size:1.2rem;margin:0}
.about{color:var(--muted);margin:0;font-size:.92rem}
.btn{font:800 1rem var(--body);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--gold);color:#2a1d00;touch-action:manipulation;user-select:none;-webkit-user-select:none;text-align:left}
.btn small{display:block;font-weight:700;font-size:.78rem;opacity:.75}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:700 1rem var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--stage);color:var(--ink)}
.msg{text-align:center;font-weight:800;min-height:1.5em;margin:0}
.score{display:flex;justify-content:space-between;font-weight:800;font-variant-numeric:tabular-nums;gap:8px}
.score .me{color:var(--gold)}
.codebox{text-align:center;font:800 2rem var(--display);letter-spacing:.2em;color:var(--gold)}
canvas{display:block;width:100%;max-width:100%;border-radius:14px;background:var(--stage);touch-action:none}

/* In the app: no stripe (the app has its own top bar) */
.app .tilet{display:none}
/* Boards and the Genna field fill the screen without scrolling, also sideways */
.dama{width:min(100%,calc(100vh - 230px));margin:0 auto}
#gc{width:auto;max-width:100%;height:max(300px,min(calc(100dvh - 250px),calc((100vw - 64px)*1.444)));margin:0 auto}
.gwrap{position:relative;display:flex;justify-content:center}
.gstart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:80%;box-shadow:0 8px 24px rgba(0,0,0,.55)}
@media (orientation:landscape) and (max-height:560px){
  .wrap{max-width:none}
  #play{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"area who" "area status" "area after";align-items:start;gap:10px}
  #area{grid-area:area}#who{grid-area:who}#status{grid-area:status}#afterRow{grid-area:after}
  .dama{width:calc(100vh - 40px)}
  #gc{height:calc(100dvh - 70px)}
  #genna .about{display:none}
  .bar{position:sticky;top:0}
}
/* Dama */
.dama{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;border:4px solid #5a3b22}
.dama div{display:grid;place-items:center;min-width:0}
.dama .l{background:#e9cfa3}.dama .d{background:#8a5a33;cursor:pointer}
.dama .d.hl{background:#4e8a52}
.pc{width:76%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:.9rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.pc.p0{background:var(--cream);color:#2a1d00}.pc.p1{background:#26201c;color:var(--gold);border:2px solid #6b5a4b}
.pc.sel{outline:3px solid var(--gold);outline-offset:1px}

/* Riddles */
.riddle{font-size:1.25rem;font-weight:800;text-align:center;margin:0;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{font:700 1rem var(--body);padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--stage);color:var(--ink);cursor:pointer}
.opts button.ok{border-color:var(--green)}.opts button.no{opacity:.4}
.towns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.towns button{font:700 .9rem var(--geez);border:1px solid var(--line);background:var(--stage);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}

/* meters */
.meter{position:relative;height:34px;border-radius:10px;background:var(--stage);overflow:hidden;border:2px solid var(--line)}
.meter .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--green) 40%,transparent)}
.meter .needle{position:absolute;top:0;bottom:0;width:4px;background:var(--gold);border-radius:2px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:#8a4b22}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--gold);color:var(--gold)}
.steps span.done{background:var(--green);border-color:var(--green);color:#062}
.cups{display:flex;justify-content:center;gap:14px;font-size:2.4rem}
.stars{text-align:center;font-size:1.8rem;letter-spacing:4px;color:var(--gold);margin:0}
.note{font-size:.84rem;color:var(--muted);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0}
@media (max-width:400px){.crd{width:58px;height:88px}.crd .s{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){.tok.can{animation:none}}
</style>

<style>
[hidden]{display:none!important}
html,body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app .wrap{padding-top:52px}
</style>
<script>if(new URLSearchParams(location.search).get("app")==="1")document.documentElement.classList.add("app")</script>
</head>
<body>
<div class="tilet"></div>
<div class="wrap">
  <div class="top">
    <h1 id="title" data-t="title">Habesha Games</h1>
    <div class="langs" id="langs"><button data-l="en" aria-pressed="true">EN</button><button data-l="ti" aria-pressed="false">ትግ</button><button data-l="am" aria-pressed="false">አማ</button></div>
  </div>

  <!-- HOME -->
  <section id="home">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="grid" id="homeGrid"></div>
    </div>
  </section>

  <!-- BOARD GAMES (shared shell) -->
  <section id="board" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="bar"><button class="back" data-back>←</button><h2 id="bTitle"></h2></div>
      <div class="game" id="modes"></div>
      <div class="game" id="play" hidden>
        <div class="score" id="who"></div>
        <div id="area"></div>
        <p class="msg" id="status"></p>
        <div class="row" id="afterRow"></div>
      </div>
      <p class="note" id="rulesNote"></p>
    </div>
  </section>

  <!-- GENNA -->
  <section id="genna" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="bar"><button class="back" data-back>←</button><h2 data-t="genna"></h2></div>
      <div class="game">
        <p class="about" data-t="gennaAbout"></p>
        <div class="score"><span><span data-t="you"></span> <span id="gnY">0</span></span><span><span data-t="computer"></span> <span id="gnC">0</span></span></div>
        <div class="gwrap"><canvas id="gc" width="360" height="520" aria-label="Genna field"></canvas><button class="btn gstart" id="gnStart" data-t="start"></button></div>
      </div>
    </div>
  </section>

  <!-- RIDDLES -->
  <section id="hinq" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="bar"><button class="back" data-back>←</button><h2 data-t="hinq"></h2></div>
      <div class="game">
        <p class="about" data-t="riddleAbout"></p>
        <p class="riddle" id="rQ"></p>
        <div class="opts" id="rOpts"></div>
        <button class="btn ghost" id="rGive" data-t="giveTown"></button>
        <div class="towns" id="rTowns" hidden></div>
        <p class="msg" id="rMsg"></p>
        <button class="btn" id="rNext" hidden data-t="nextRiddle"></button>
      </div>
    </div>
  </section>

</div>

  const s=peers.filter(p=>p.presence&&p.presence.g===cur&&typeof p.presence.jt==="number").sort((a,b)=>a.presence.jt-b.presence.jt);

let DSEL=-1;
const DAMA={rule:"ruleDama",
 init(first){const b=Array(64).fill("");for(let i=0;i<64;i++){const r=i>>3,c=i&7;if((r+c)%2===1){if(r<2)b[i]="b";else if(r>5)b[i]="a"}}DSEL=-1;return{b,turn:first||0,chain:-1,winner:null,last:null}},
 own(p){return p?(p.toLowerCase()==="a"?0:1):-1},
 moves(st,i,onlyJ){const p=st.b[i];if(!p)return[];const o=DAMA.own(p),king=p!==p.toLowerCase(),r=i>>3,c=i&7;
  const dirs=king?[[1,1],[1,-1],[-1,1],[-1,-1]]:o===0?[[-1,1],[-1,-1]]:[[1,1],[1,-1]];const out=[];
  dirs.forEach(([dr,dc])=>{const r1=r+dr,c1=c+dc,r2=r+2*dr,c2=c+2*dc,in1=r1>=0&&r1<8&&c1>=0&&c1<8,in2=r2>=0&&r2<8&&c2>=0&&c2<8;
   if(in1&&!st.b[r1*8+c1]&&!onlyJ)out.push({from:i,to:r1*8+c1});
   if(in1&&in2&&st.b[r1*8+c1]&&DAMA.own(st.b[r1*8+c1])!==o&&!st.b[r2*8+c2])out.push({from:i,to:r2*8+c2,cap:r1*8+c1})});return out},
 all(st,seat){if(st.chain>=0)return DAMA.moves(st,st.chain,true);const ms=[];for(let i=0;i<64;i++)if(DAMA.own(st.b[i])===seat)ms.push(...DAMA.moves(st,i,false));return ms},
 apply(st,mv,seat){const m=DAMA.all(st,seat).find(x=>x.from===mv.from&&x.to===mv.to);if(!m)return st;const p=st.b[m.from];st.b[m.to]=p;st.b[m.from]="";if(m.cap!=null)st.b[m.cap]="";
  const r=m.to>>3;let promo=false;if(p==="a"&&r===0){st.b[m.to]="A";promo=true}if(p==="b"&&r===7){st.b[m.to]="B";promo=true}
  st.last=[m.from,m.to];
  if(m.cap!=null&&!promo&&DAMA.moves(st,m.to,true).length)st.chain=m.to;else{st.chain=-1;st.turn=1-seat;if(!DAMA.all(st,1-seat).length)st.winner=seat}

  const safe=ms.filter(m=>{const t=clone(st);DAMA.apply(t,m,seat);return !DAMA.all({...t,chain:-1,turn:1-seat},1-seat).some(x=>x.cap===m.to)});

 render(el,st,v){const order=[...Array(64).keys()];if(v.seat===1)order.reverse();
  if(st.chain>=0&&v.mine)DSEL=st.chain;if(!v.mine)DSEL=-1;

};

const gc=$("gc"),g=gc.getContext("2d"),W=360,H=520,GW=120;
let GN={on:false,ys:0,cs:0};
function gnReset(dir){GN.ball={x:W/2,y:H/2,vx:(Math.random()-.5)*3,vy:dir*3.2,r:9};GN.p={x:W/2,y:H-70,r:22,px:W/2,py:H-70};GN.c={x:W/2,y:70,r:22}}
gnReset(1);
function gnDraw(){
  g.fillStyle="#2f6b3a";g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=2;g.beginPath();g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();
  g.beginPath();g.arc(W/2,H/2,40,0,7);g.stroke();
  g.fillStyle=css("--gold");g.fillRect(W/2-GW/2,0,GW,6);g.fillRect(W/2-GW/2,H-6,GW,6);
  const stick=(o,col)=>{g.fillStyle=col;g.beginPath();g.arc(o.x,o.y,o.r,0,7);g.fill();g.strokeStyle="#5a3b22";g.lineWidth=6;g.beginPath();g.moveTo(o.x,o.y);g.lineTo(o.x+(o.y>H/2?18:-18),o.y+(o.y>H/2?34:-34));g.stroke()};
  stick(GN.p,css("--cream"));stick(GN.c,"#26201c");
  const b=GN.ball;g.fillStyle="#d9b38c";g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();
}
function hit(o,b){const dx=b.x-o.x,dy=b.y-o.y,d=Math.hypot(dx,dy);if(d<o.r+b.r){tick(o===GN.p?520:330,.08);if(o===GN.p&&navigator.vibrate)navigator.vibrate(15);const nx=dx/d,ny=dy/d;
  const sp=Math.max(5,Math.hypot(b.vx,b.vy)+.6);b.vx=nx*sp+(o.vx||0)*.3;b.vy=ny*sp+(o.vy||0)*.3;b.x=o.x+nx*(o.r+b.r+1);b.y=o.y+ny*(o.r+b.r+1)}}
function gnStep(){
  if(!GN.on)return;
  const b=GN.ball,p=GN.p,c=GN.c;
  p.vx=p.x-p.px;p.vy=p.y-p.py;p.px=p.x;p.py=p.y;
  const tx=Math.max(c.r,Math.min(W-c.r,b.x)),ty=b.y<H/2?Math.min(b.y-30,160):70;
  c.vx=Math.max(-3.2,Math.min(3.2,tx-c.x));c.vy=Math.max(-3,Math.min(3,Math.max(40,ty)-c.y));c.x+=c.vx;c.y+=c.vy;
  b.x+=b.vx;b.y+=b.vy;b.vx*=.995;b.vy*=.995;
  if(b.x<b.r||b.x>W-b.r){b.vx*=-1;b.x=Math.max(b.r,Math.min(W-b.r,b.x))}
  const inGoal=Math.abs(b.x-W/2)<GW/2;
  if(b.y<b.r){if(inGoal){GN.ys++;return gnGoal(T("youScore"),-1)}b.vy=Math.abs(b.vy);b.y=b.r}
  if(b.y>H-b.r){if(inGoal){GN.cs++;return gnGoal(T("cpuScore"),1)}b.vy=-Math.abs(b.vy);b.y=H-b.r}
  hit(p,b);hit(c,b);
  const sp=Math.hypot(b.vx,b.vy);if(sp>11){b.vx*=11/sp;b.vy*=11/sp}
  gnDraw();requestAnimationFrame(gnStep);
