<style>
/* Layout: title row, one full-width 3D stage with instructor banner on top, speed + limit bottom-left, mistakes top-right, arrow to next crossing, touch pedals, start/result card over it */
:root{--bg:#0b1118;--ink:#f3f6fa;--muted:#a3b1c2;--gold:#f7c948;--line:#223142;--good:#3ccf8e;--bad:#ff5d5d;--display:"Noto Sans Ethiopic","Sora",system-ui,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--display);margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-weight:800;font-size:1.45rem}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;background:#000}
@media (max-width:640px){.stage{aspect-ratio:3/4}}
.stage canvas{display:block;width:100%;height:100%}
.instr{position:absolute;top:10px;left:10px;right:80px;background:rgba(10,16,24,.78);backdrop-filter:blur(6px);border-radius:14px;padding:9px 13px;border-left:5px solid var(--gold)}
.instr b{display:block;font-size:1.05rem;line-height:1.35}
.instr span{display:block;font-size:.76rem;color:#d4dde8;margin-top:3px;line-height:1.4}
.mistbox{position:absolute;top:10px;right:10px;width:60px;text-align:center;background:rgba(10,16,24,.78);border-radius:14px;padding:6px 0;font-size:.68rem;color:var(--muted)}
.mistbox strong{display:block;font:800 1.4rem "Sora";color:var(--ink)}
.speed{position:absolute;left:10px;bottom:84px;display:flex;align-items:center;gap:8px;background:rgba(10,16,24,.7);border-radius:14px;padding:6px 10px 6px 6px}
.speed .num{font:800 1.6rem "Sora";min-width:2.2ch;text-align:right}
.speed small{color:var(--muted);font-size:.7rem}
.nav{position:absolute;right:10px;bottom:84px;background:rgba(10,16,24,.7);border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:6px;font:800 .9rem "Sora"}
.nav .arr{width:26px;height:26px;display:grid;place-items:center;font-size:1.3rem;color:var(--gold)}
.toast{position:absolute;left:50%;top:42%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;font-weight:800;font-size:1rem;max-width:86%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast small{display:block;font-weight:600;font-size:.82rem;margin-top:3px}
.toast.good{background:var(--good);color:#04210f}.toast.bad{background:var(--bad);color:#2b0000}
.pedals{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
.pedals div{display:flex;gap:10px}
.pb{pointer-events:auto;width:62px;height:62px;border-radius:16px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.42);color:#fff;font:800 1.3rem "Sora";touch-action:none;backdrop-filter:blur(4px);cursor:pointer}
.pb.on{background:rgba(255,255,255,.3)}
.pb.g{background:rgba(60,207,142,.35)}.pb.b{background:rgba(255,93,93,.35)}
.inds{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);display:flex;gap:64px;pointer-events:none}
.ind.horn{font-size:1.05rem;margin-left:6px}.ind.horn:active{background:rgba(247,201,72,.55)}
.ind{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.42);color:#fff;font:800 1.2rem "Sora";touch-action:none;cursor:pointer}
.ind.on{border-color:#3ccf8e}.ind.flash{background:#3ccf8e;color:#04210f}
.speed.over .num{color:#ff5d5d}
.tilt{font:700 .9rem var(--display);width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0b1118;color:var(--ink);cursor:pointer}
.tilt.on{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.modes{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.modec{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#0b1118;color:var(--ink);border-radius:14px;padding:12px;cursor:pointer;font:700 1rem var(--display);width:100%}
.modec b{font-size:1.5rem}.modec small{display:block;color:var(--muted);font-weight:500;font-size:.8rem;margin-top:2px}.modec .st{margin-left:auto;color:var(--gold);white-space:nowrap}
#endB{position:absolute;top:64px;right:10px;font:800 .8rem var(--display);padding:7px 11px;border-radius:999px;border:0;background:var(--gold);color:#2a1d00;cursor:pointer}
.freeM .nav{display:none}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,9,14,.62);padding:14px;overflow:auto}
.card{background:#111a25;border:2px solid var(--line);border-radius:18px;padding:18px;max-width:440px;width:100%;max-height:100%;overflow:auto}
.card h2{margin:0 0 8px;font-size:1.3rem}
.card p{margin:6px 0;line-height:1.5;font-size:.92rem}
.card .small{color:var(--muted);font-size:.8rem}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.rules svg{width:48px;height:48px}
.list{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.list li{display:flex;gap:10px;align-items:center;background:#0b1118;border-radius:10px;padding:6px 8px;font-size:.88rem}
.list svg{flex:0 0 40px}
.btn{font:800 1rem var(--display);background:var(--gold);color:#2a1d00;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;width:100%;margin-top:8px}
.keys{color:var(--muted);font-size:.78rem;margin:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
html,body{margin:0;overscroll-behavior:none}
.app .wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-block:6px;gap:8px}
.app .stage{aspect-ratio:auto;height:calc(100dvh - 86px)}
.focus .hdr{display:none}.focus.app .stage,.focus .stage{height:calc(100dvh - 12px)!important;aspect-ratio:auto}
.hdr{display:flex;align-items:center;gap:10px}.hdr .stars{margin-left:auto;font:800 1rem "Sora";color:var(--gold)}
.pedals{bottom:calc(24px + env(safe-area-inset-bottom,0px))!important;align-items:flex-end}
.pb{width:74px!important;height:74px!important;font-size:1.5rem!important}
.wheelpad{pointer-events:auto;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;touch-action:none;background:radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,.45));border:2px solid rgba(255,255,255,.3)}
.wheel{font-size:4.8rem;line-height:1;color:#fff;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.speed{bottom:calc(178px + env(safe-area-inset-bottom,0px))!important}.nav{bottom:calc(150px + env(safe-area-inset-bottom,0px))!important}
.stage canvas.gps{position:absolute;right:10px;top:66px;width:118px;height:118px;border-radius:14px;background:rgba(10,16,24,.75);border:1px solid rgba(255,255,255,.15);pointer-events:none}
.mistbox{top:10px!important}
.hitflash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 40%,rgba(255,0,0,.5));opacity:0;transition:opacity .4s}.hitflash.on{opacity:1;transition:none}
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:10px 0}
.dests button{border:2px solid var(--line);background:#0b1118;color:var(--ink);border-radius:14px;padding:10px 6px;font:700 .92rem var(--display);cursor:pointer}
.dests button b{display:block;font-size:1.7rem}.dests button.on{border-color:var(--gold);background:#2a2410}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.langs button{border:1px solid var(--line);background:#0b1118;color:var(--ink);border-radius:999px;padding:5px 11px;font:700 .85rem var(--display);cursor:pointer}
.langs button.on{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.big3{font-size:2.4rem;text-align:center;letter-spacing:6px;margin:4px 0}
/* pedals: wide brake, tall gas, round gear button for reverse */
.pedals .pdl{display:flex;align-items:flex-end;gap:12px}
.pb{width:auto!important;height:auto!important;border:0!important;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font:700 .72rem var(--display)!important;color:#fff;background:none!important;backdrop-filter:none}
.pb i{display:block;border-radius:12px;background:repeating-linear-gradient(180deg,#454c55 0 6px,#262a30 6px 11px);border:2px solid rgba(255,255,255,.45);box-shadow:0 6px 16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .06s}
.pb.b i{width:80px;height:62px}.pb.g i{width:54px;height:92px}
.pb.on i{transform:translateY(4px) scale(.96);border-color:#fff}.pb.b.on i{box-shadow:0 0 20px rgba(255,93,93,.85)}.pb.g.on i{box-shadow:0 0 20px rgba(60,207,142,.85)}
.pb span{text-shadow:0 1px 3px #000}
.gearb{pointer-events:auto;align-self:center;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(10,16,24,.8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;cursor:pointer;touch-action:manipulation}
.gearb b{font:800 1.25rem "Sora"}.gearb small{font-size:.62rem;color:var(--muted)}
.gearb.on{background:#c62828;border-color:#ff8a80}.gearb.on small{color:#fff}
.wheelpad{background:radial-gradient(circle,rgba(0,0,0,0) 52%,rgba(0,0,0,.32))!important;border:0!important}
.wheel{width:100%;height:100%;display:grid;place-items:center;font-size:0}
.wheel svg{width:90%;height:90%;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.nav .arr{width:auto;min-width:26px;font-size:1.5rem}
@media (orientation:landscape) and (max-height:560px){
  .pb.b i{width:70px;height:54px}.pb.g i{width:48px;height:78px}
  .hdr{display:none}.wrap{padding:0!important;max-width:none}.stage{aspect-ratio:auto!important;height:calc(100dvh - 4px)!important;border-radius:0}
  .wheelpad{width:120px;height:120px}.wheel{font-size:4rem}
  .speed{bottom:140px!important}.nav{bottom:126px!important}
  .instr{right:140px}
}

/* compact start menu: one row of destinations, small signs, Start always visible at the bottom */
.dests{grid-template-columns:repeat(5,1fr);gap:6px}
.dests button{padding:8px 2px;font-size:.72rem;line-height:1.25;border-radius:12px}.dests button b{font-size:1.5rem}
.rules{flex-wrap:nowrap;overflow:hidden;gap:5px}.rules svg{width:34px;height:34px;flex:0 0 auto}
.card .langs{flex-wrap:nowrap;overflow-x:auto}.card .langs button{flex:0 0 auto}
.card #go,.card #again{position:sticky;bottom:-18px;box-shadow:0 -14px 18px #111a25;margin-top:12px}
.card h2{font-size:1.15rem}
.app .wrap{padding:44px 10px 6px!important}.app .hdr{display:none}.app .stage{height:calc(100dvh - 52px)!important}
.focus.app .wrap{padding:0!important}.focus.app .stage{height:100dvh!important;border-radius:0}
@media (max-width:560px) and (orientation:portrait){.stage canvas.gps{top:auto!important;bottom:calc(206px + env(safe-area-inset-bottom,0px));width:104px;height:104px}}
@media (orientation:landscape) and (max-height:560px){.stage canvas.gps{width:92px;height:92px}.nav{bottom:auto!important;top:84px;right:110px}}
</style>

      <div class="pdl"><button class="gearb" id="bRv" type="button"><b id="gear">D</b><small id="gearTo">⇄ R</small></button><button class="pb b" id="bB"><i></i><span id="lB">ፍሬን</span></button><button class="pb g" id="bG"><i></i><span id="lG">ነዳዲ</span></button></div></div>

<script>
const CITIES={
 kampala:{name:"Kampala",tag:"Uganda · drive left",side:-1,elev:12,az:250,turb:4,ray:2.8,exp:.55,fog:0xe6c49a,fogD:[160,650],ground:0x6f8f3f,walk:0xb5a490,
   bld:[0xf2efe6,0xe9d7b5,0xd9e6e8,0xf0b890,0xcfd8c4,0xe6e0d0],hmin:4,hmax:18,player:0xf4f4f4,taxi:0x2a5bd7,boda:true,landmark:"mosque",hills:0x5a7f35,trees:.25,night:0},
 addis:{name:"Addis Ababa",tag:"Ethiopia · drive right",side:1,elev:55,az:170,turb:3,ray:2.6,exp:.5,fog:0xcfe0ee,fogD:[180,700],ground:0x8e7e60,walk:0xa8a39a,
   bld:[0xf1eee6,0xd8d3c6,0xbcd0e0,0xe8c99a,0xc7c2b8,0x9fb7c9],hmin:8,hmax:40,player:0x1f6fd1,taxi:0x1f6fd1,landmark:"meskel",hills:0x667a46,trees:.12,night:0},
 asmara:{name:"Asmara",tag:"Eritrea · drive right",side:1,elev:28,az:230,turb:2.5,ray:2.6,exp:.52,fog:0xe9dcc2,fogD:[180,700],ground:0xc2a172,walk:0xd6c6a6,
   bld:[0xf3d7a1,0xe8b7a0,0xbfd9c9,0xf1e3c4,0xd4c0e0,0xf2c9b6],hmin:4,hmax:13,player:0xc81e1e,taxi:0xf2c230,palms:true,landmark:"tagliero",hills:0x8d7a5a,trees:.2,night:0},
 oslo:{name:"Oslo",tag:"Norway · drive right",side:1,elev:-1.5,az:240,turb:2,ray:3,exp:.42,fog:0x34445f,fogD:[60,320],ground:0xeef2f6,walk:0xd9dee4,
   bld:[0xe9e4dc,0xc9b49a,0xa8b5c3,0x8f3b2e,0xdcd6cc,0x6e7f6a],hmin:7,hmax:20,player:0x16233a,taxi:0x111111,snow:true,landmark:"opera",hills:0x7d8f99,trees:.15,night:1}
};
const ORDER=["kampala","addis","asmara","oslo"];
let cityKey="asmara";

/* ---------- renderer ---------- */
const stage=document.getElementById("stage");
const MOBILE=matchMedia("(pointer:coarse)").matches;
const renderer=new THREE.WebGLRenderer({antialias:!MOBILE,powerPreference:"high-performance"});
const PR_MAX=Math.min(MOBILE?1.5:1.75,window.devicePixelRatio||1);let PR=MOBILE?Math.min(1,PR_MAX):PR_MAX;
renderer.setPixelRatio(PR);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=MOBILE?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const pmrem=new THREE.PMREMGenerator(renderer);
const cam=new THREE.PerspectiveCamera(60,1,.1,1500);

/* ---------- procedural textures ---------- */
function canvasTex(w,h,draw,repeat){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.encoding=THREE.sRGBEncoding;if(repeat)t.repeat.set(...repeat);return t}
function noise(g,w,h,base,amt,n){g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){const v=Math.random()*amt;g.fillStyle=`rgba(${Math.random()<.5?"0,0,0":"255,255,255"},${v})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}}
const hex=c=>"#"+c.toString(16).padStart(6,"0");
const TEX={};
function makeShared(){
  TEX.road=canvasTex(256,512,(g,w,h)=>{noise(g,w,h,"#404246",.06,6000);
    g.fillStyle="rgba(0,0,0,.18)";for(let i=0;i<6;i++)g.fillRect(Math.random()*w,0,8+Math.random()*20,h);
    g.fillStyle="#e8e4d6";g.fillRect(10,0,6,h);g.fillRect(w-16,0,6,h);
    g.fillStyle="#f1e9c8";for(let y=0;y<h;y+=128)g.fillRect(w/2-3,y,6,64);});
  TEX.inter=canvasTex(256,256,(g,w,h)=>{noise(g,w,h,"#404246",.06,4000)});
  TEX.walk=canvasTex(256,256,(g,w,h)=>{noise(g,w,h,"#b9b4aa",.12,4000);g.strokeStyle="rgba(0,0,0,.22)";g.lineWidth=2;for(let i=0;i<=w;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}},[6,6]);
  TEX.ground=canvasTex(512,512,(g,w,h)=>noise(g,w,h,"#ffffff",.12,30000),[60,60]);
}
function facade(base,night){ // texture covers 12m x 12m: 4 floors x 4 windows
  const lit=[];
  const map=canvasTex(256,256,(g,w,h)=>{noise(g,w,h,hex(base),.08,5000);
    for(let f=0;f<4;f++)for(let i=0;i<4;i++){const x=i*64+14,y=f*64+12;
      g.fillStyle="rgba(0,0,0,.25)";g.fillRect(x-3,y-3,42,46);
      const on=night&&Math.random()<.45;lit.push(on);
      const gr=g.createLinearGradient(x,y,x+36,y+40);gr.addColorStop(0,on?"#ffd89a":"#5d7488");gr.addColorStop(1,on?"#f2a54a":"#1c2733");g.fillStyle=gr;g.fillRect(x,y,36,40);
      g.fillStyle="rgba(255,255,255,.15)";g.fillRect(x+17,y,2,40);
      g.fillStyle="rgba(0,0,0,.15)";g.fillRect(0,f*64+60,w,4);}
  });
  let em=null;
  if(night){let k=0;em=canvasTex(256,256,(g,w,h)=>{g.fillStyle="#000";g.fillRect(0,0,w,h);
    for(let f=0;f<4;f++)for(let i=0;i<4;i++){if(lit[k++]){g.fillStyle="#ffcf8a";g.fillRect(i*64+14,f*64+12,36,40)}}})}
  return {map,em};
}

/* ---------- materials ---------- */
const STD=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof mat==="number"?STD(mat):mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(parent||world).add(m);return m}

/* ---------- vehicles ---------- */
const glassMat=STD(0x0d141c,{roughness:.05,metalness:.9});
const tireMat=STD(0x111111,{roughness:.9});
const rimMat=STD(0xc9ced6,{roughness:.25,metalness:1});
const headMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff3d6,emissiveIntensity:2});
const tailMat=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff1a1a,emissiveIntensity:1.6});
function carMesh(color,taxi){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const paint=STD(color,{roughness:.28,metalness:.55,envMapIntensity:1.2});

function lessTraffic(){let n=0;agents.sort((a,b)=>Math.hypot(b.mesh.position.x-player.x,b.mesh.position.z-player.z)-Math.hypot(a.mesh.position.x-player.x,a.mesh.position.z-player.z));
  while(n<3&&agents.length>4){scene.remove(agents.shift().mesh);n++}while(walkers.length>3&&n<5){scene.remove(walkers.shift().m);n++}return n>0}

function build(key){
  const C=CITIES[key];
  scene=new THREE.Scene();world=new THREE.Group();scene.add(world);
  renderer.toneMappingExposure=C.exp;
  // sky & sun
  sky=new THREE.Sky();sky.scale.setScalar(4000);const u=sky.material.uniforms;
  u.turbidity.value=C.turb;u.rayleigh.value=C.ray;u.mieCoefficient.value=.005;u.mieDirectionalG.value=.8;
  const sunDir=new THREE.Vector3().setFromSphericalCoords(1,THREE.MathUtils.degToRad(90-C.elev),THREE.MathUtils.degToRad(C.az));
  u.sunPosition.value.copy(sunDir);scene.add(sky);
  const envScene=new THREE.Scene();const sky2=sky.clone();envScene.add(sky2);
  scene.environment=pmrem.fromScene(envScene).texture;
  scene.fog=new THREE.Fog(C.fog,C.fogD[0],C.fogD[1]);
  hemi=new THREE.HemisphereLight(C.night?0x6f86b8:0xdfeaff,0x5a4a3a,C.night?.35:.55);scene.add(hemi);
  sun=new THREE.DirectionalLight(C.night?0x8fa8e8:(C.elev<20?0xffc98a:0xfff0d8),C.night?.25:4.2);
  sun.userData.dir=sunDir.clone();sun.castShadow=true;sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
  Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:400});scene.add(sun);scene.add(sun.target);
  // ground
  const gm=STD(C.ground,{roughness:1,map:TEX.ground});const g=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),gm);g.rotation.x=-Math.PI/2;g.position.y=-.2;g.receiveShadow=true;world.add(g);
  // roads
  const roadMat=STD(0xffffff,{map:TEX.road,roughness:C.snow?.55:.92,metalness:C.snow?.15:0});
  const len=N*CELL+RD;
  for(let i=0;i<=N;i++){
    const tv=TEX.road.clone();tv.needsUpdate=true;tv.repeat.set(1,len/24);
    const mv=roadMat.clone();mv.map=tv;
    const v=new THREE.Mesh(new THREE.PlaneGeometry(RD,len),mv);v.rotation.x=-Math.PI/2;v.position.set(roadPos(i),.02,0);v.receiveShadow=true;world.add(v);
    const h=v.clone();h.rotation.z=Math.PI/2;h.position.set(0,.021,roadPos(i));world.add(h);
  }
  const interMat=STD(0xffffff,{map:TEX.inter,roughness:C.snow?.55:.92});
  for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const m=new THREE.Mesh(new THREE.PlaneGeometry(RD,RD),interMat);m.rotation.x=-Math.PI/2;m.position.set(roadPos(i),.03,roadPos(j));m.receiveShadow=true;world.add(m)}
  // facades
  const facs=C.bld.map(c=>facade(c,C.night));
  const roofMat=STD(C.snow?0xf4f7fa:0x6e6a64,{roughness:.9});
  const walkMat=STD(C.walk,{map:TEX.walk,roughness:.95});
  buildings=[];glows=[];solids=[];SHOPSPOTS=[];PUMPS=[];
  for(let bi=0;bi<N;bi++)for(let bj=0;bj<N;bj++){
    const cx=roadPos(bi)+CELL/2,cz=roadPos(bj)+CELL/2;
    box(BLK,.25,BLK,walkMat,cx,.125,cz);
    box(BLK+.3,.2,BLK+.3,STD(0x8d8a84),cx,.1,cz);
    // lamps on block corners
    [[-1,-1],[1,1]].forEach(([sx,sz])=>lamp(cx+sx*(BLK/2-.6),cz+sz*(BLK/2-.6),sx>0?Math.PI*.75:-Math.PI*.25,C.night));
    if(bi===3&&bj===3){landmark(C.landmark).position.set(cx,.25,cz);buildings.push({x:cx,z:cz,w:BLK-2,d:BLK-2});continue}
    if(key==="lesson"&&specialBlock(bi,bj,cx,cz))continue;
    // a small park in the middle of the block
    {const gm=new THREE.Mesh(new THREE.BoxGeometry(BLK-30,.3,BLK-30),STD(C.snow?0xeef2f5:0x5f8a3f,{roughness:1}));gm.position.set(cx,.3,cz);gm.receiveShadow=true;world.add(gm);
     if(!C.snow&&Math.random()<.7)tree(cx+(Math.random()-.5)*8,cz+(Math.random()-.5)*8,C.palms)}
    for(const[ox,oz]of BPOS){
      if(key==="lesson"&&LOT&&LOT.bi===bi&&LOT.bj===bj&&LOT.ox===ox&&LOT.oz===oz)continue;
      if(Math.random()<C.trees){tree(cx+ox,cz+oz,C.palms);continue}
      const h=Math.round((C.hmin+Math.random()*(C.hmax-C.hmin)*(Math.random()<.15?1.6:1))/3)*3;
      const fi=Math.floor(Math.random()*facs.length),F=facs[fi];
      const fm=STD(0xffffff,{map:F.map,roughness:.75});if(F.em){fm.emissiveMap=F.em;fm.emissive=new THREE.Color(0xffc887);fm.emissiveIntensity=1.4}
      const geo=new THREE.BoxGeometry(11,h,11);const uv=geo.attributes.uv;
      for(let k=0;k<uv.count;k++){const face=Math.floor(k/4);if(face===2||face===3)continue;uv.setXY(k,uv.getX(k)*11/12,uv.getY(k)*h/12)}
      const b=new THREE.Mesh(geo,[fm,fm,roofMat,roofMat,fm,fm]);b.position.set(cx+ox,h/2+.25,cz+oz);b.castShadow=true;b.receiveShadow=true;world.add(b);
      box(11.4,.5,11.4,STD(C.snow?0xf4f7fa:0x8a857c),cx+ox,h+.5,cz+oz);
      if(h>15&&!C.snow)box(2.5,1.6,2.5,STD(0x9aa0a6,{metalness:.5,roughness:.5}),cx+ox+2,h+1.5,cz+oz-2);
      buildings.push({x:cx+ox,z:cz+oz,w:11,d:11});
      if(key==="lesson"&&LOT&&LOT.nb===bi+","+bj+","+ox+","+oz)destFront(cx+ox,cz+oz,LOT.face);
      else if(key==="lesson")shopFront(cx+ox,cz+oz,ox,oz);
    }
  }
  if(key==="lesson")cityDetails();
  // hills
  for(let i=0;i<34;i++){const a=i/34*Math.PI*2,rad=40+Math.random()*30,r=HALF*Math.SQRT2+RD+30+rad+Math.random()*60,h=25+Math.random()*50;
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(rad,2),STD(C.snow?0xe9eef3:C.hills,{flatShading:true,roughness:1}));
    m.scale.y=h/55;m.position.set(Math.cos(a)*r,-6,Math.sin(a)*r);world.add(m)}
  mergeStatic(world);
  // traffic
  traffic=[];
  for(let n=0;n<0;n++){
    const vert=Math.random()<.5,i=Math.floor(Math.random()*(N+1)),dir=Math.random()<.5?1:-1;
    const isBoda=C.boda&&Math.random()<.45;
    const m=isBoda?bodaMesh():carMesh(Math.random()<.5?C.taxi:[0xd9dde2,0x23272e,0x8b1e1e,0x9aa5ad,0xe8e2d0][n%5],!isBoda&&Math.random()<.5);
    world.add(m);traffic.push({m,vert,i,dir,t:(Math.random()-.5)*N*CELL,sp:(isBoda?11:8)+Math.random()*5,boda:isBoda});
  }
  // snow
  snow=null;
  if(C.snow){const n=2500,geo=new THREE.BufferGeometry(),p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*120;p[i*3+1]=Math.random()*50;p[i*3+2]=(Math.random()-.5)*120}
    geo.setAttribute("position",new THREE.BufferAttribute(p,3));
    const st=canvasTex(32,32,(g)=>{const gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.fillRect(0,0,32,32)});
    snow=new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.45,map:st,transparent:true,depthWrite:false}));scene.add(snow)}
  // player
  player.mesh=carMesh(C.player,true);scene.add(player.mesh);
  const lampBox=(x,y,z,w,mat)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.14,.06),mat);m.position.set(x,y,z);player.mesh.add(m);return m};
  player.brakeMat=new THREE.MeshBasicMaterial({color:0x3a0606});[-.62,.62].forEach(x=>lampBox(x,.86,2.32,.42,player.brakeMat));
  player.indL=new THREE.MeshBasicMaterial({color:0x3a2606});player.indR=new THREE.MeshBasicMaterial({color:0x3a2606});
  [[-.92,player.indL],[.92,player.indR]].forEach(([x,m])=>{lampBox(x,.86,2.32,.14,m);lampBox(x,.72,-2.32,.14,m)});
  if(C.night){[-.7,.7].forEach(x=>{const s=glowSprite(0xfff3d6,2.2);s.position.set(x,.86,-2.3);player.mesh.userData.body.add(s)});
    const beam=new THREE.SpotLight(0xfff1d6,3,60,.5,.6,1);beam.position.set(0,1,-2);beam.target.position.set(0,0,-20);player.mesh.add(beam);player.mesh.add(beam.target);}
  ring=new THREE.Mesh(new THREE.TorusGeometry(4,.35,12,48),new THREE.MeshBasicMaterial({color:0xffd34d}));ring.rotation.x=Math.PI/2;scene.add(ring);
  const beamM=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,60,16,1,true),new THREE.MeshBasicMaterial({color:0xffd34d,transparent:true,opacity:.28,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));
  beamM.position.set(0,0,-30);beamM.rotation.x=-Math.PI/2;ring.add(beamM);
}

function frame(kind,inner){

}

function seeded(seed){let s=seed;return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648}}
function buildSignQuestions(){const out=[],rnd=seeded(7);
  const pick=(arr,n,not)=>{const pool=arr.filter(x=>x!==not);const r=[];while(r.length<n&&pool.length){r.push(pool.splice(Math.floor(rnd()*pool.length),1)[0])}return r};
  const groupOf=g=>SIGNS.filter(s=>s[4]===g||(["prohib","speed"].includes(g)&&["prohib","speed"].includes(s[4]))).map(s=>s[0]);
  const all=SIGNS.map(s=>s[0]);
  SIGNS.forEach(([id,,,mean,grp])=>{
    let same=groupOf(grp);if(same.length<4)same=same.concat(pick(all,4,id).filter(x=>!same.includes(x)));
    const others=pick(same,3,id);const opts=[id,...others];const order=opts.map((x,i)=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    const lead=grp==="light"?"እዚ መብራህቲ እንታይ ማለት እዩ?":grp==="mark"?"እዚ ምልክት ኣብ ጽርግያ እንታይ ማለት እዩ?":"እዚ ምልክት እንታይ ማለት እዩ?";
    out.push({q:lead,img:id,o:order.map(x=>SIGN[x].mean),c:order.indexOf(id),ex:mean,cat:"sign"});
    if(grp!=="light"&&grp!=="mark"){
      const order2=pick(same,3,id).concat([id]).map(x=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
      out.push({q:`«${mean}» ዝብል ምልክት ኣየናይ እዩ?`,o:order2.map(x=>({s:x})),c:order2.indexOf(id),ex:mean,cat:"sign"})}});
  const KIND={warn:"ምልክት ሓደጋ (መጠንቀቕታ)",prohib:"ምልክት ክልከላ",speed:"ምልክት ክልከላ",mand:"ምልክት ግዴታ",info:"ምልክት ሓበሬታ",prio:"ምልክት ቅድሚ"};
  const KOPTS=["ምልክት ሓደጋ (መጠንቀቕታ)","ምልክት ክልከላ","ምልክት ግዴታ","ምልክት ሓበሬታ","ምልክት ቅድሚ"];
  SIGNS.forEach(([id,,,mean,grp],i)=>{if(!KIND[grp]||i%2)return;const right=KIND[grp];const opts=[right,...pick(KOPTS.filter(k=>k!==right),3)];
    const order=opts.map(x=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    out.push({q:"እዚ ምልክት ካብ ኣየናይ ዓይነት እዩ?",img:id,o:order,c:order.indexOf(right),ex:`${right}፡ ${mean}።`,cat:"sign"})});
  const ACT={curveR:"ፍጥነት ኣንኪስካ ብጥንቃቐ ጠውይ",curveL:"ፍጥነት ኣንኪስካ ብጥንቃቐ ጠውይ",dbl:"ፍጥነት ኣንኪስካ ብጥንቃቐ ጠውይ",
   slope:"ብትሑት ማርሻ ኪድ፡ ፍረኖ ብዙሕ ከይተሞቕ",narrows:"ቀስ በል፡ ምስ ዝመጽእ ትራፊክ ተሰማማዕ",bumps:"ፍጥነት ኣንክይ",hump:"ፍጥነት ኣንክይ",
   slippery:"ቀስ በል፡ ብሃንደበት ፍረኖን መሪሕን ኣይትግበር",works:"ቀስ በል፡ ንሰራሕተኛታትን ምልክታትን ተኸተል",peds:"ደው ክትብል ተዳሎ፡ ንእግረኛታት ተጠንቀቕ",
   kids:"ብዙሕ ቀስ በል፡ ቆልዑ ብሃንደበት ክሰግሩ ይኽእሉ",bikes:"ንብሽክለታታት ተጠንቀቕ፡ ርሕቀት ሕደግ",deer:"ቀስ በል፡ እንስሳታት ክሰግሩ ይኽእሉ",

   railGate:"ቀስ በል፡ ኣብ ልዕሊ ሓዲድ ደው ኣይትበል",railNoGate:"ቀስ በል፡ ባቡር ከይመጸ ጸጋምን የማንን ርአ",roundAhead:"ቀስ በል፡ ኣብ ሮቶንዳ ዘለዉ ቅድሚ ሃቦም",
   twoWay:"ብየማን ጎድኒ ሓዝ፡ ካብ ቅድሚ ትራፊክ ኣሎ",queue:"ቀስ በል፡ ደው ክትብል ተዳሎ",give:"ቅድሚ ሃብ፡ ኣድላዪ እንተኾይኑ ደው በል",
   stop:"ኣብ መስመር ደው ምባል ምሉእ ብምሉእ ደው በል",prio:"ቅድሚ ኣሎካ፡ ግን ብጥንቃቐ ኪድ",prioEnd:"ሕጊ የማን ደጊሙ ይሰርሕ፡ ተጠንቀቕ"};
  const ACTS=[...new Set(Object.values(ACT))];
  Object.keys(ACT).forEach(id=>{const right=ACT[id];const opts=[right,...pick(ACTS.filter(a=>a!==right),3)];
    const order=opts.map(x=>[x,rnd()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    out.push({q:"ነዚ ምልክት ምስ ረኣኻ እንታይ ትገብር?",img:id,o:order,c:order.indexOf(right),ex:`${SIGN[id].mean}፡ ${right}።`,cat:"sign"})});
  return out}

  if(MENU==="mis"){$("menu").innerHTML=`<h2>🎯 ${TI.modeMis}</h2><div class="modes" id="misL">${MISSIONS.map((m,i)=>`<button class="modec" data-i="${i}"><b>${m.ic}</b><span>${esc(TI[m.t])} ${PRO||m.free?"":"🔒"}</span><span class="st">${"⭐".repeat(PROG.stars[m.id]||0)}${"☆".repeat(3-(PROG.stars[m.id]||0))}</span></button>`).join("")}</div>${homeBtn}`;$("ov").hidden=false;

  // slow phones: give the app up to 7 s to send the unlock before showing the lock screen
  if(!PRO&&QSD.get("app")==="1"&&performance.now()<7000){$("menu").innerHTML=`<h2>${TI.title}</h2><p>…</p>`;$("ov").hidden=false;setTimeout(()=>{if(!L||!L.on)drawMenu()},7100-performance.now());return}
  if(!PRO){$("menu").innerHTML=`<h2>🔒 ${TI.title}</h2><p>${TI.locked}</p><p class="small">${TI.lockHow}</p><button class="btn" id="back">← ${TI.backTxt}</button>${homeBtn}`;$("ov").hidden=false;bindHome();
    $("back").onclick=()=>{location.href="../life-tools/"+location.search};return}
  $("menu").innerHTML=`<h2>${TI.choose}</h2><div class="dests" id="dests">${DESTS.slice(0,TEST_DESTS).map(([k,ic],i)=>`<button data-i="${i}" class="${i===destI?"on":""}"><b>${ic}</b>${esc(TI.dest[k])}</button>`).join("")}</div>
    <div class="rules" id="rules">${["speed30","speed50","lightsAhead","stop","give","crossingHere","keepRight","parking"].map(i=>signSVG(i,48)).join("")}</div>
    <p class="small">${TI.passRule}</p>${langs}<button class="tilt ${TILT?"on":""}" id="tiltB">📱 ${TI.tilt}</button><p class="keys">${TI.tap}</p><button class="btn" id="go">${TI.start} → ${DESTS[destI][1]}</button>${homeBtn}`;$("ov").hidden=false;bindHome();
  $("dests").onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;destI=+b.dataset.i;newRoute(true);drawMenu()};
  $("go").onclick=startLesson;$("tiltB").onclick=toggleTilt;bindLangs()}
function bindLangs(){$("dLangs").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;LANG=b.dataset.l;tiFallback=false;try{localStorage.setItem(LANG_KEY,LANG)}catch(err){}drawMenu()}}
// steering wheel: drag left/right
(function(){const pad=$("wheel"),k=$("wheelK");let id=null,x0=0;
  pad.addEventListener("pointerdown",e=>{e.preventDefault();id=e.pointerId;x0=e.clientX;pad.setPointerCapture(id);P.steer=0});
  pad.addEventListener("pointermove",e=>{if(e.pointerId!==id)return;const v=Math.max(-1,Math.min(1,(e.clientX-x0)/55));P.steer=v;k.style.transform=`rotate(${v*120}deg)`});
  const up=e=>{if(e.pointerId!==id)return;id=null;P.steer=null;k.style.transform=""};pad.addEventListener("pointerup",up);pad.addEventListener("pointercancel",up)})();
// indicators: tap once on, again off; they switch off by themselves after the turn
let IND=0,indTurned=0,indPhase=false,indNext=0;
function setInd(d){IND=IND===d?0:d;indTurned=0;$("iL").classList.toggle("on",IND<0);$("iR").classList.toggle("on",IND>0);if(!IND){$("iL").classList.remove("flash");$("iR").classList.remove("flash");player.indL.color.setHex(0x3a2606);player.indR.color.setHex(0x3a2606)}}
function tickInd(now,dt,yaw){if(!IND)return;indTurned+=Math.abs(yaw)*dt;if(indTurned>1&&Math.abs(player.steer)<.12){setInd(IND);return}
  if(now<indNext)return;indNext=now+350;indPhase=!indPhase;const el=$(IND<0?"iL":"iR"),m=IND<0?player.indL:player.indR;el.classList.toggle("flash",indPhase);m.color.setHex(indPhase?0xffa41c:0x3a2606);relayClick(indPhase)}
$("hornB").addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();horn()});
addEventListener("keydown",e=>{if(e.key.toLowerCase()==="h"&&!e.repeat)horn()});
// no engine sound when the app goes to the background
document.addEventListener("visibilitychange",()=>{if(document.hidden)engineOff()});
[["iL",-1],["iR",1]].forEach(([id,d])=>$(id).addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();if(L&&L.on)setInd(d)}));
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(L&&L.on&&!e.repeat&&(k==="q"||k==="e"))setInd(k==="q"?-1:1)});
// optional: steer by tilting the phone
let TILT=false;try{TILT=localStorage.getItem("dl-tilt")==="1"}catch(e){}
addEventListener("deviceorientation",e=>{if(!TILT||!L||!L.on||e.beta==null)return;const land=innerWidth>innerHeight,ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  const deg=land?(ang===90?e.beta:-e.beta):e.gamma,v=Math.abs(deg)<2.5?0:Math.max(-1,Math.min(1,deg/26));P.steer=v;$("wheelK").style.transform=`rotate(${v*120}deg)`});
async function toggleTilt(){if(!TILT&&window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){try{if(await DeviceOrientationEvent.requestPermission()!=="granted")return}catch(e){return}}
  TILT=!TILT;if(!TILT)P.steer=null;try{localStorage.setItem("dl-tilt",TILT?"1":"0")}catch(e){}drawMenu()}
// tap the 3D view → hide/show the top bar
stage.addEventListener("click",e=>{if(e.target.closest("button,.wheelpad,.ov"))return;document.documentElement.classList.toggle("focus");setTimeout(resize,50)});
makeShared();newRoute(true);drawMenu();
requestAnimationFrame(loop);

</script>
