name: habesha_hub
description: Habesha Hub - community app for the Ethiopian and Eritrean diaspora

version: 2.3.0+48

publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  google_places_flutter: ^2.0.9

  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  uuid: ^4.2.2
  image_picker: ^1.0.4
  cupertino_icons: ^1.0.2
  http: ^1.2.0
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  share_plus: ^10.0.0
  video_player: ^2.8.6
  chewie: ^1.8.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  sign_in_with_apple: ^7.0.1
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1
  in_app_purchase: ^3.3.1
  cloud_functions: ^5.6.2
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#131313"
  adaptive_icon_foreground: "assets/images/icon.png"
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Design fonts (were in assets/fonts but never registered, so the app used the system font)
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerif-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/NotoSerif-Black.ttf
          weight: 900
        - asset: assets/fonts/NotoSerif-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
